<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  body{font-family:'Inter',system-ui,sans-serif}
  h1,h2,h3,p,span,li,a,button,label,div,td,th{overflow-wrap:break-word}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem}
  .btn{border-radius:.75rem;font-weight:600;transition:.15s}
  .btn:active{transform:scale(.97)}
  .opt{border:1.5px solid #e2e8f0;border-radius:.75rem;transition:.12s}
  .opt:hover{border-color:#a5b4fc;background:#eef2ff}
  .opt.sel{border-color:#4f46e5;background:#eef2ff}
  .opt.benar{border-color:#10b981;background:#ecfdf5}
  .opt.salah{border-color:#ef4444;background:#fef2f2}
  .navbtn.on{color:#4f46e5}
  .navbtn.on i{transform:translateY(-2px)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media print{
    .no-print{display:none!important}
    body{background:#fff;padding:0}
    .card{border:none;box-shadow:none}
    .print-area{border:1px solid #cbd5e1!important;border-radius:0}
    @page{margin:1.2cm}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  }
</style>

<body class="bg-slate-50 text-slate-800 pb-28">

<header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-4 pt-5 pb-6 no-print">
  <div class="max-w-3xl mx-auto flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-[11px] uppercase tracking-widest text-indigo-200 font-semibold">Persiapan Kedokteran</p>
      <h1 class="text-xl font-extrabold leading-tight">ARAI Prep <span class="font-medium text-indigo-200">· TKA &amp; SNBP</span></h1>
    </div>
    <button onclick="location.hash='#/pengaturan'" class="btn bg-white/15 hover:bg-white/25 px-3 py-2 text-sm shrink-0"><i class="fa-solid fa-gear"></i></button>
  </div>
</header>

<main id="view" class="max-w-3xl mx-auto px-4 -mt-3">
  <div id="memuat" class="card p-6 text-center" style="margin-top:1rem">
    <p style="font-weight:700">Memuat aplikasi…</p>
    <p style="font-size:12px;color:#64748b;margin-top:6px">Kalau tulisan ini tidak hilang dalam beberapa detik, ketuk tombol di bawah.</p>
    <button onclick="paksaMuatUlang()" style="margin-top:12px;background:#4f46e5;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600">Bersihkan cache &amp; muat ulang</button>
  </div>
</main>

<nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 no-print z-40">
  <div class="max-w-3xl mx-auto grid grid-cols-5 text-[11px] font-semibold text-slate-500">
    <a href="#/beranda"   data-nav="beranda"   class="navbtn py-2.5 text-center"><i class="fa-solid fa-house block text-lg mb-0.5"></i>Beranda</a>
    <a href="#/latihan"   data-nav="latihan"   class="navbtn py-2.5 text-center"><i class="fa-solid fa-pen-to-square block text-lg mb-0.5"></i>Latihan</a>
    <a href="#/tryout"    data-nav="tryout"    class="navbtn py-2.5 text-center"><i class="fa-solid fa-stopwatch block text-lg mb-0.5"></i>Tryout</a>
    <a href="#/analisis"  data-nav="analisis"  class="navbtn py-2.5 text-center"><i class="fa-solid fa-chart-simple block text-lg mb-0.5"></i>Analisis</a>
    <a href="#/target"    data-nav="target"    class="navbtn py-2.5 text-center"><i class="fa-solid fa-bullseye block text-lg mb-0.5"></i>Target</a>
  </div>
</nav>

<script>
/* Penangkap galat: layar kosong diganti pesan yang bisa dibaca dan dilaporkan. */
window.APP_VERSI = 'v5 · 5 Sep 2026';
function paksaMuatUlang(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }
    if(window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
  }catch(e){}
  setTimeout(function(){ location.replace(location.pathname + '?v=' + Date.now()); }, 400);
}
function tampilkanGalat(pesan){
  var v = document.getElementById('view');
  if(!v) return;
  v.innerHTML = '<div class="card" style="padding:16px;margin-top:16px">'
    + '<p style="font-weight:800;color:#b91c1c">Aplikasi gagal ditampilkan</p>'
    + '<p style="font-size:13px;color:#334155;margin-top:6px">Tunjukkan pesan di bawah ini supaya bisa diperbaiki:</p>'
    + '<pre style="font-size:11px;white-space:pre-wrap;background:#f1f5f9;padding:10px;border-radius:10px;margin-top:8px">'
    + String(pesan).replace(/[<>]/g,'') + '\n\nVersi: ' + window.APP_VERSI + '</pre>'
    + '<button onclick="paksaMuatUlang()" style="margin-top:12px;background:#4f46e5;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600">Bersihkan cache &amp; muat ulang</button>'
    + '</div>';
}
window.addEventListener('error', function(e){
  var v = document.getElementById('view');
  if(v && document.getElementById('memuat')) tampilkanGalat((e.message||'galat') + ' @ ' + (e.filename||'').split('/').pop() + ':' + (e.lineno||'?'));
});
</script>
